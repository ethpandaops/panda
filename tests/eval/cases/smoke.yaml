# Smoke test cases for ethpandaops-panda CI.
#
# Fast, simple, single-turn questions that verify nothing is fundamentally broken:
# the agent reaches each datasource, runs a query, and returns a plausible answer.
# Deliberately simple (counts / current values / lists), external-data-only (so they
# run as the external-scoped panda-ci identity), and quick. Heavier analytics
# (p50 arrival, client breakdowns) belong in the full suite, not the smoke gate.

- id: mainnet_block_count_1h
  description: Block production count on mainnet in the last hour
  input: "How many blocks were produced on Ethereum mainnet in the last 1 hour?"
  metrics:
    task_completion: 0.5
  network: mainnet
  tags: [smoke, clickhouse, blocks]

- id: list_datasources
  description: Discover available datasources
  input: "What datasources are available for me to query? List them."
  metrics:
    task_completion: 0.5
  tags: [smoke, discovery]

- id: devnets_running
  description: List currently running devnets
  input: "What devnets are currently running?"
  metrics:
    task_completion: 0.5
  tags: [smoke, dora, devnets]

- id: devnet_beacon_cpu
  description: Beacon node CPU usage on a devnet
  input: "How much CPU is a beacon node using on a devnet right now?"
  metrics:
    task_completion: 0.5
  tags: [smoke, prometheus, devnets]

- id: devnet_beacon_peers
  description: Beacon node peer count on a devnet
  input: "What is the peer count of a beacon node on a devnet right now?"
  metrics:
    task_completion: 0.5
  tags: [smoke, prometheus, devnets]
