# Smoke test cases for ethpandaops-panda CI.
#
# Fast, simple, single-turn questions that verify nothing is fundamentally broken:
# the agent can reach each datasource, run a query, and return a plausible answer.
# These intentionally only touch EXTERNAL data (ClickHouse default/external dbs,
# devnet Prometheus, Dora) so they run as the external-scoped panda-ci identity.

# ---- ClickHouse (raw beacon/execution events + refined fct_* on external dbs) ----

- id: mainnet_block_count_1h
  description: Block production count on mainnet in the last hour
  input: "How many blocks were produced on Ethereum mainnet in the last 1 hour?"
  expected_tools:
    - execute_python
  metrics:
    tool_correctness: 0.5
    task_completion: 0.5
  network: mainnet
  tags: [smoke, clickhouse, blocks]

- id: mainnet_p50_block_arrival_24h
  description: Median block arrival time on mainnet over the last 24h
  input: "What is the p50 (median) block arrival time, in seconds into the slot, over the last 24 hours on mainnet?"
