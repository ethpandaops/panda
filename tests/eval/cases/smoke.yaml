# Smoke test cases for ethpandaops-panda CI.
#
# A couple of fast, simple questions that verify the whole pipeline works end to end:
# the agent reaches the data, runs a query, and returns a plausible answer. Runs as
# the external-scoped panda-ci identity against the hosted production proxy.
#
# Grading is promptfoo `assert:` blocks (llm-rubric). The rubric describes what a
# correct answer looks like — a wrong number fails instead of passing on plausibility.

  - id: mainnet_block_arrival_p50
    description: p50 block arrival of the most recent mainnet block
    input: "What's the p50 block arrival of the most recent mainnet block?"
    network: mainnet
    tags: [smoke, clickhouse, blocks, timing]
    assert:
      - type: llm-rubric
        value: >
          Reports a p50 (median) block arrival time for recent mainnet blocks,
          derived from a real ClickHouse query against block-timing data. An answer
          with no
          number, a hallucinated figure, or one wildly outside that range fails.

    variations:
      - What is the p50 block arrival for the most recent mainnet block?
      - Give me the p50 block arrival of the latest mainnet block.
      - I'm trying to find the p50 block arrival for the most recent mainnet 
        block.
      - For the most recent mainnet block, what is the p50 block arrival?
      - Please report the p50 block arrival metric for the most recent mainnet 
        block.
  - id: list_datasources
    description: Discover available datasources
    input: "What datasources are available for me to query? List them."
    tags: [smoke]
    assert:
      - type: llm-rubric
        value: >
          Lists the datasources the harness actually exposes (discovered live, not
          guessed). A vague non-answer or an invented list fails.

    variations:
      - Which datasources can I query? Please list them.
      - List the datasources that are available for me to query.
      - I'm trying to see what datasources I can query. Can you list them?
      - What are all of the available datasources I’m able to query?
      - Please provide a list of the datasources available for me to query.
  - id: block_count_24h
    description: Block production count for the last 24 hours
    input: "How many blocks were produced on mainnet in the last 24 hours?"
    network: mainnet
    tags: [smoke, clickhouse, blocks]
    assert:
      - type: llm-rubric
        value: >
          Reports a count of mainnet blocks produced in the last 24 hours, from a
          real
          query. A missing or hallucinated figure fails - the data must be sourced
          from  a datasource.


    variations:
      - How many mainnet blocks were produced in the last 24 hours?
      - Count the number of blocks produced on mainnet over the last 24 hours.
      - In the past 24 hours, how many blocks has mainnet produced?
      - I'm trying to find the total number of blocks produced on mainnet in the
        last 24 hours.
      - What is the block production count on mainnet for the last 24 hours?
  - id: missed_slots_24h
    description: Missed slots in the last 24 hours
    input: "How many slots were missed in the last 24 hours on mainnet?"
    network: mainnet
    tags: [smoke, clickhouse, blocks]
    assert:
      - type: llm-rubric
        value: >
          Reports a count of missed (skipped) mainnet slots over the last 24 hours,
          from a real query. This is normally a small fraction of slots (order of
          tens),
          so a low count passes; a missing answer or an implausibly huge number fails.
    variations:
      - 'Missed slots on mainnet in the last 24 hours: how many?'
      - What is the count of missed slots on mainnet over the last 24 hours?
      - I'm trying to find out how many slots have been missed on mainnet during
        the last 24 hours.
      - Please report the number of slots missed on mainnet in the last 24 
        hours.
      - For mainnet, how many slots were missed over the past 24 hours?
  - id: chartkit_default_arrival_distribution               # 💬 charts should default to chartkit
    description: distribution of block arrival times on a fixed day, charted with
      the default charting library
    network: mainnet
    tags: [smoke, multi_step, visualization, blocks, timing]
    steps:
      - prompt: "Query the first-seen block arrival times for mainnet blocks on
          20 June 2026 (UTC)."
      - prompt: "Plot the distribution of those arrival times as a chart."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent queries real first-seen block arrival times for
          mainnet blocks on 20 June 2026 UTC (~7,180 blocks that day; median ~1.45s
          into the slot, accept ~1.3-1.6s, and a p95 ~3.1s, accept ~2.8-3.5s) and
          renders the distribution with the ethpandaops chartkit library — the sandbox
          code imports and calls chartkit (e.g. `from ethpandaops import chartkit as
          ck; ck.histogram(...)`), NOT raw matplotlib / plotly / seaborn and NOT an
          ASCII chart — then points at the saved chartkit image artifact (a
          storage/chart URL or the path of the saved image). Reaching for
          matplotlib/plotly instead of chartkit, a text/ASCII chart, no image
          artifact, or implausible timings all fail. A saved path passes just like a
          URL. Must re-use the session across turns (look for a session_id.)
    variations:
      - Pull first-seen arrival times for mainnet blocks on 20 June 2026 (UTC), then
        chart how they're distributed.
      - For mainnet blocks on 20 June 2026 (UTC), get the first-seen arrival times and
        visualize their distribution.
      - I want to see how block arrival times were spread across mainnet blocks on
        20 June 2026 (UTC) — query them and plot it.
      - Fetch the first-seen arrival times of mainnet blocks on 20 June 2026 (UTC) and
        show the distribution as a chart.
  - id: storage_upload_session_scoped                       # 💬 storage.upload returns a share URL + a host path, grouped per session
    description: upload a file from the sandbox and report its public URL and
      server host path, then upload again in the same session
    network: mainnet
    tags: [smoke, multi_step, storage]
    steps:
      - prompt: "Save the 10 most recent mainnet blocks (slot and block arrival) to a
          CSV file in the sandbox, upload it, and give me a link I can share."
      - prompt: "Upload that same file again as blocks-backup.csv, and tell me where
          both files now live on the panda server."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent saves real mainnet block data to a file in the
          sandbox and uploads it with the ethpandaops storage library (a
          storage.upload call), returning the public URL to share. In the second turn
          it uploads the file again in the SAME session — look for one shared
          session_id reused across both turns, not a fresh session — and reports where
          the files live on the panda server, i.e. the host path the upload returns
          (UploadResult.host_path, the file's path on the server filesystem), with both
          files grouped under the same session directory. A correct answer surfaces
          both a public URL and a server-side host path from real uploads. Inventing a
          URL or path without an actual upload, using a non-ethpandaops uploader,
          starting a new session for the second upload, or never reporting the host
          path all fail.
    variations:
      - Save the latest 10 mainnet blocks to a CSV in the sandbox, upload it, and hand
        me a shareable link.
      - Write the 10 most recent mainnet blocks (slot + arrival) to a file, upload it
        for sharing, then re-upload it as blocks-backup.csv and tell me both files'
        locations on the server.
      - Export the last 10 mainnet blocks to a CSV, upload it so I can share it, and
        afterwards upload a backup copy in the same session and report where they sit
        on the server.

  - id: evm_faucet_fund_throwaway_address                    # 💬 how do I get test ETH for an address
    description: name the sandbox call that funds an address from a devnet's
      agent faucet
    network: glamsterdam-devnet-8
    tags: [smoke, evm, docs]
    input: "I need test ETH on glamsterdam-devnet-8 for a fresh throwaway address.
      What's the panda way to do that? Just tell me the call, don't claim anything
      yet."
    assert:
      - type: llm-rubric
        value: >
          Points at the sandbox EVM library: evm.faucet(network, address) from the
          ethpandaops package (an `from ethpandaops import evm` style import), passing
          the network id and the target address, and gets the throwaway address from
          evm.wallet() rather than inventing one. Mentioning that the claim is mined
          server-side and returns a transaction hash is a plus. Sending the user to a
          faucet website, a browser flow, a WebSocket, or any API panda does not have
          fails, as does answering with no concrete call.

    variations:
      - How do I get test ETH onto a brand-new address on glamsterdam-devnet-8 using
        panda? Just the call please, don't run it.
      - Which panda API funds a throwaway wallet with test ETH on
        glamsterdam-devnet-8? Don't claim yet, I just want the snippet.
      - I want to fund a fresh address with test ETH on glamsterdam-devnet-8 - what
        does that look like in panda? Show me the call without executing it.
      - What's the right way to hand a new throwaway address some test ETH on
        glamsterdam-devnet-8 with panda? No need to actually claim.
      - Tell me the panda call for funding a fresh address with test ETH on
        glamsterdam-devnet-8, without running it.
