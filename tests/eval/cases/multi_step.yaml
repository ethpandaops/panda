# Multi-step (multi-turn) cases for ethpandaops-panda.
#
# These run as a single session: the first `steps` prompt is the opening question, the
# rest are followups in the same session (the loader flattens steps -> input + followups).
# `expect_session_id` / `use_previous_session` carry the session semantics for the older
# pytest path. Grading is a single case-level `assert:` over the FINAL aggregated answer.

- id: session_data_analysis
  description: Multi-turn data analysis with session persistence
  network: mainnet
  tags: [multi_step, session, analysis]
  steps:
    - prompt: "Query the last 1000 blocks on mainnet and save the data to a CSV file."
      expect_session_id: true
    - prompt: "Now load that CSV and calculate the average gas used per block."
      use_previous_session: true
    - prompt: "Create a histogram of gas usage from the data."
      use_previous_session: true
  assert:
    - type: llm-rubric
      value: >
        Across the turns the agent queries ~1000 recent mainnet blocks and persists
        them, computes a plausible average gas used per block (tens of millions of gas,
        e.g. ~10M-40M), and produces a histogram of gas usage (a returned chart URL or
        saved image). Reusing the saved data across turns rather than re-querying from
        scratch is the point; a missing final chart or an implausible gas figure fails.

- id: block_timing_analysis
  description: Detailed block timing analysis workflow
  network: mainnet
  tags: [multi_step, timing, analysis]
  steps:
    - prompt: "Query block arrival times for the last 10000 slots on mainnet."
      expect_session_id: true
    - prompt: "Group the data by observer consensus client and calculate the mean and p95 arrival time for each."
      use_previous_session: true
    - prompt: "Create a box plot comparing the arrival time distributions across clients."
      use_previous_session: true
  assert:
    - type: llm-rubric
      value: >
        Across the turns the agent pulls block arrival times for recent mainnet slots,
        breaks them down per observing consensus client with mean and p95 values
        (plausible sub-second to a few-second timings), and produces a box plot
        comparing the per-client distributions (a returned chart URL or saved image).
        A missing final plot, no per-client breakdown, or implausible timings fails.
