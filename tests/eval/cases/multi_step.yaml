# Multi-step (multi-turn) cases for ethpandaops-panda.
#
# Each case runs as a single session: the first `steps` prompt opens it, the rest are
# followups in the same session (the loader flattens steps -> input + followups). Grading
# is a single case-level `assert:` over the FINAL aggregated answer — we grade the OUTCOME,
# not the method. Session reuse vs re-querying isn't asserted: re-doing work just burns
# tokens, which the efficiency objective already penalizes.

  - id: session_data_analysis
    description: Multi-turn data analysis with session persistence
    network: mainnet
    tags: [multi_step, clickhouse, blocks, visualization]
    steps:
      - prompt: "Query the last 1000 blocks on mainnet and save the data to a CSV
          file."
      - prompt: "Now load that CSV and calculate the average gas used per block."
      - prompt: "Create a histogram of gas usage from the data."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent queries ~1000 recent mainnet blocks, computes
          a plausible average gas used per block (tens of millions of gas, e.g.
          ~10M-40M), and produces a real histogram image of gas usage, pointing at
          that image artifact — either a storage/chart URL or the path of the saved
          image file. An ASCII-only or text-only chart with no image artifact, or an
          implausible gas figure, fails; the question never asked for the chart to be
          hosted, so a saved image referenced by path passes just like an uploaded
          URL. Must re-use the session to maintain persistence between turns (look
          for a session_id.)

    variations:
      - Fetch data for the most recent 1000 blocks on mainnet and write it to a 
        CSV file.
      - I'm trying to pull the last 1000 mainnet blocks and save the resulting 
        data as a CSV.
      - Please query mainnet for the last 1000 blocks and export the data to 
        CSV.
      - Can you retrieve data from the latest 1000 blocks on mainnet and store 
        it in a CSV file?
      - Run a query over the last 1000 blocks on mainnet, then save the data 
        into a CSV file.
  - id: block_timing_analysis
    description: Detailed block timing analysis workflow
    network: mainnet
    tags: [multi_step, clickhouse, blocks, timing, visualization]
    steps:
      - prompt: "Query block arrival times for the last 100 slots on mainnet."
      - prompt: "Group the data by observer consensus client and calculate the mean
          and p95 arrival time for each."
      - prompt: "Create a box plot comparing the arrival time distributions across
          clients."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent pulls block arrival times for recent mainnet
          slots, breaks them down per observing consensus client with mean and p95
          values (plausible sub-second to a few-second timings), and produces a real
          box plot image comparing the per-client distributions, pointing at that
          image artifact — either a storage/chart URL or the path of the saved image
          file. An ASCII-only or text-only chart with no image artifact, no per-client
          breakdown, or implausible timings fails; the question never asked for the
          chart to be hosted, so a saved image referenced by path passes just like an
          uploaded URL. Must re-use the session to maintain persistence between turns
          (look for a session_id.)
    variations:
      - Get block arrival times for the last 100 slots on mainnet.
      - Can you query the block arrival times for the last 100 slots on mainnet?
      - I'm trying to retrieve block arrival times over the last 100 slots on 
        mainnet.
      - Please query mainnet block arrival times for the last 100 slots.
      - Fetch the arrival times of blocks for the last 100 slots on mainnet.
  - id: attestation_volume_analysis                       # 💬 attestations-per-day ask
    description: per-day attestation event volume for 1-7 June 2026, per 
      network, charted
    network: mainnet
    tags: [multi_step, clickhouse, attestations, visualization]
    steps:
      - prompt: "How many attestation events per day landed in the raw beacon API
          event stream on mainnet for 1-7 June 2026 (UTC)?"
      - prompt: "Now break that down per network — mainnet, hoodi and sepolia."
      - prompt: "Chart the per-network daily volumes."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent counts raw beacon-API attestation events per
          day for 1-7 June 2026 (filtering on the partition key — these tables are
          billions of rows). Measured daily averages for that week: mainnet ~975M
          events/day (~6.8B total), hoodi ~420M/day, sepolia ~1.5M/day; accept
          ~±15% with that network ordering. Then produces a real per-network chart
          image and points at that image artifact — either a storage/chart URL or the
          path of the saved image file. Wrong magnitudes, wrong ordering, or an
          ASCII-only/text-only chart with no image artifact fails; the question never
          asked for the chart to be hosted, so a saved image referenced by path
          passes just like an uploaded URL. Must re-use the session to maintain
          persistence between turns (look for a session_id.)
    variations:
      - For each day from 1-7 June 2026 (UTC), how many attestation events 
        landed in the raw beacon API event stream on mainnet?
      - Count the attestation events per day in the raw beacon API event stream 
        on mainnet for 1-7 June 2026 (UTC).
      - I'm trying to find the daily number of attestation events that landed in
        the raw beacon API event stream on mainnet between 1 and 7 June 2026 
        (UTC).
      - What was the per-day count of attestation events landing in the raw 
        beacon API event stream on mainnet during 1-7 June 2026 (UTC)?
      - Please report, by day, how many attestation events landed in the raw 
        beacon API event stream on mainnet for 1-7 June 2026 (UTC).
  - id: chartkit_default_arrival_distribution               # 💬 charts should default to chartkit
    description: distribution of block arrival times on a fixed day, charted with
      the default charting library
    network: mainnet
    tags: [multi_step, visualization, blocks, timing, clickhouse]
    steps:
      - prompt: "Query the first-seen block arrival times for mainnet blocks on
          20 June 2026 (UTC)."
      - prompt: "Plot the distribution of those arrival times as a chart."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent queries real first-seen block arrival times for
          mainnet blocks on 20 June 2026 UTC (~7,180 blocks that day; median ~1.45s
          into the slot, accept ~1.3-1.6s, and a p95 ~3.1s, accept ~2.8-3.5s) and
          renders the distribution with the ethpandaops chartkit library — the sandbox
          code imports and calls chartkit (e.g. `from ethpandaops import chartkit as
          ck; ck.histogram(...)`), NOT raw matplotlib / plotly / seaborn and NOT an
          ASCII chart — then points at the saved chartkit image artifact (a
          storage/chart URL or the path of the saved image). Reaching for
          matplotlib/plotly instead of chartkit, a text/ASCII chart, no image
          artifact, or implausible timings all fail. A saved path passes just like a
          URL. Must re-use the session across turns (look for a session_id.)
    variations:
      - Pull first-seen arrival times for mainnet blocks on 20 June 2026 (UTC), then
        chart how they're distributed.
      - For mainnet blocks on 20 June 2026 (UTC), get the first-seen arrival times and
        visualize their distribution.
      - I want to see how block arrival times were spread across mainnet blocks on
        20 June 2026 (UTC) — query them and plot it.
      - Fetch the first-seen arrival times of mainnet blocks on 20 June 2026 (UTC) and
        show the distribution as a chart.
  - id: chartkit_default_entity_bar                         # 💬 charts should default to chartkit
    description: top proposer entities on a fixed day, charted with the default
      charting library
    network: mainnet
    tags: [multi_step, visualization, blocks, clickhouse]
    steps:
      - prompt: "Which staking entities proposed the most blocks on mainnet on
          20 June 2026 (UTC)? Give me the top 10."
      - prompt: "Show those top entities as a chart."
    assert:
      - type: llm-rubric
        value: >
          Across the turns the agent queries real proposer-entity data for the top 10
          block-proposing entities on mainnet on 20 June 2026 UTC. The measured leaders
          that day are binance (~567 blocks) and solo_stakers (~543), followed by
          whale_0x8ebd (~325), ether.fi (~320), coinbase (~286), then whale_0x9212,
          figment, blockdaemon, piertwo and kiln (~150-245); accept ~±15% on counts and
          reasonable variation in the mid-pack ordering. It then renders them with the
          ethpandaops chartkit library — the sandbox code imports and calls chartkit
          (e.g. `from ethpandaops import chartkit as ck; ck.bar(...)`), NOT raw
          matplotlib / plotly and NOT an ASCII chart — producing a bar chart of blocks
          per entity and pointing at the saved chartkit image artifact (a storage/chart
          URL or the path of the saved image). Reaching for matplotlib/plotly instead of
          chartkit, a text/ASCII chart, no image artifact, or hallucinated
          entities/counts all fail. A saved path passes just like a URL. Must re-use the
          session across turns (look for a session_id.)
    variations:
      - Find the top 10 block-proposing staking entities on mainnet for 20 June 2026
        (UTC), then chart them.
      - On mainnet on 20 June 2026 (UTC), which entities proposed the most blocks? Show
        the top 10 on a chart.
      - I'm trying to see the leading block proposers (staking entities) on mainnet on
        20 June 2026 (UTC) as a chart — top 10.
      - Rank the staking entities by blocks proposed on mainnet on 20 June 2026 (UTC)
        and visualize the top 10.
