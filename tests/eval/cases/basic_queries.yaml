# Basic single-turn query cases for ethpandaops-panda.
#
# These pressure-test the common shape: a plain question that needs one real query
# against mainnet data. Graded by llm-rubric — the rubric pins what a correct answer
# looks like so a hallucinated number fails.

- id: block_count_24h
  description: Block production count for the last 24 hours
  input: "How many blocks were produced on mainnet in the last 24 hours?"
  network: mainnet
  tags: [basic, blocks]
  assert:
    - type: llm-rubric
      value: >
        Reports a count of mainnet blocks produced in the last 24 hours, from a real
        query. With ~5 slots/min and a high fill rate this is roughly 7000-7200 blocks;
        an answer in that ballpark passes, a missing or hallucinated figure fails.

- id: slot_time_stats
  description: Average block arrival time over recent slots
  input: "What is the average block arrival time for the last 1000 slots on mainnet?"
  network: mainnet
  tags: [basic, timing]
  assert:
    - type: llm-rubric
      value: >
        Reports an average block arrival/first-seen time for recent mainnet slots,
        from real block-timing data. A plausible value is sub-second to a couple of
        seconds (roughly hundreds of ms up to ~2 s). No number or a wild figure fails.

- id: validator_count
  description: Current active validator count
  input: "How many active validators are there on mainnet right now?"
  network: mainnet
  tags: [basic, validators]
  assert:
    - type: llm-rubric
      value: >
        Reports a current active validator count for mainnet, from a real query —
        plausibly on the order of one million validators. A vague non-answer or an
        obviously wrong magnitude fails.

- id: missed_slots_24h
  description: Missed slots in the last 24 hours
  input: "How many slots were missed in the last 24 hours on mainnet?"
  network: mainnet
  tags: [basic, missed_slots]
  assert:
    - type: llm-rubric
      value: >
        Reports a count of missed (skipped) mainnet slots over the last 24 hours,
        from a real query. This is normally a small fraction of slots (order of tens),
        so a low count passes; a missing answer or an implausibly huge number fails.
