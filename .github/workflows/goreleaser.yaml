name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      packages: write        # push images
      id-token: write        # keyless cosign signing + provenance via OIDC
      attestations: write    # actions/attest-build-provenance
    outputs:
      image: ${{ steps.attest.outputs.image }}
      digests: ${{ steps.attest.outputs.digests }}
      sandbox-digests: ${{ steps.attest-sandbox.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive latest tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(.+))$ ]]; then
            SUFFIX="${BASH_REMATCH[2]}"
            echo "latest_tag=${SUFFIX}-latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Sigstore cosign for keyless artifact + image signing. The cosign binary is
      # pinned independently of the installer action: cosign v3 defaults sign-blob
      # to the new bundle format, which ignores our --output-signature/--output-certificate
      # args and breaks the .sig/.pem release assets that docs/verifying-releases.md
      # promises. Moving to v3 means switching the signs config to --bundle and
      # updating the verification docs together — do that deliberately, not via an
      # installer bump.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      # Syft for SBOM generation (GoReleaser shells out to it).
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push sandbox image
        id: sandbox
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Strip the leading "v" so sandbox tags match goreleaser's
          # {{ .Version }} convention used for the server and proxy images
          # (e.g. sandbox-0.31.0, not sandbox-v0.31.0).
          VERSION=${TAG#v}
          SHORT_SHA=${GITHUB_SHA::7}
          LATEST_TAG=${{ steps.meta.outputs.latest_tag }}

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file sandbox/Dockerfile \
            --tag "ghcr.io/ethpandaops/panda:sandbox-${VERSION}" \
            --tag "ghcr.io/ethpandaops/panda:sandbox-${VERSION}-${SHORT_SHA}" \
            --tag "ghcr.io/ethpandaops/panda:sandbox-${LATEST_TAG}" \
            --metadata-file "$RUNNER_TEMP/sandbox-metadata.json" \
            --push .

          echo "tags=sandbox-${VERSION} sandbox-${VERSION}-${SHORT_SHA} sandbox-${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/sandbox-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --parallelism 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          # The rc promotion flow puts two tags on one commit (v1.2.3-rc.N and
          # v1.2.3); goreleaser's git-describe version detection can pick the
          # wrong one. Pin it to the tag that actually triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # SLSA build provenance linking the release artifacts back to this
      # workflow run and source commit. Verify with `gh attestation verify`.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz

      # Keyless-sign the immutable version-pinned image tags. cosign resolves
      # each tag to its digest and signs by digest; floating tags (e.g.
      # *-latest) share that digest, so a digest-based verify still holds.
      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          for ref in \
            "ghcr.io/ethpandaops/panda:${VERSION}" \
            "ghcr.io/ethpandaops/panda:server-${VERSION}" \
            "ghcr.io/ethpandaops/panda:proxy-${VERSION}" \
            "ghcr.io/ethpandaops/panda:sandbox-${VERSION}"; do
            echo "Signing ${ref}"
            cosign sign --recursive "${ref}"
          done

      - name: Attest images
        id: attest
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          goreleaser-artifacts: dist/artifacts.json
          mirror: "false"

      - name: Attest sandbox image
        id: attest-sandbox
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          tags: ${{ steps.sandbox.outputs.tags }}
          digest: ${{ steps.sandbox.outputs.digest }}
          mirror: "false"

  # Separate job, so "Re-run failed jobs" retries only the mirror and never
  # rebuilds the images.
  mirror:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write      # authenticate to the image mirror
    steps:
      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: ${{ needs.release.outputs.image }}
          tags: ${{ needs.release.outputs.digests }} ${{ needs.release.outputs.sandbox-digests }}
          attest: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
