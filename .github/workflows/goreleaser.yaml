name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    runs-on:
      - self-hosted-ghr
      - size-l-x64
    permissions:
      contents: write       # create the GitHub release
      packages: write        # push images
      id-token: write        # keyless cosign signing + provenance via OIDC
      attestations: write    # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive latest tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(.+))$ ]]; then
            SUFFIX="${BASH_REMATCH[2]}"
            echo "latest_tag=${SUFFIX}-latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Sigstore cosign for keyless artifact + image signing. The cosign binary is
      # pinned independently of the installer action: cosign v3 defaults sign-blob
      # to the new bundle format, which ignores our --output-signature/--output-certificate
      # args and breaks the .sig/.pem release assets that docs/verifying-releases.md
      # promises. Moving to v3 means switching the signs config to --bundle and
      # updating the verification docs together — do that deliberately, not via an
      # installer bump.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      # Syft for SBOM generation (GoReleaser shells out to it).
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push sandbox image
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Strip the leading "v" so sandbox tags match goreleaser's
          # {{ .Version }} convention used for the server and proxy images
          # (e.g. sandbox-0.31.0, not sandbox-v0.31.0).
          VERSION=${TAG#v}
          SHORT_SHA=${GITHUB_SHA::7}
          LATEST_TAG=${{ steps.meta.outputs.latest_tag }}

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file sandbox/Dockerfile \
            --tag "ethpandaops/panda:sandbox-${VERSION}" \
            --tag "ethpandaops/panda:sandbox-${VERSION}-${SHORT_SHA}" \
            --tag "ethpandaops/panda:sandbox-${LATEST_TAG}" \
            --push .

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean --parallelism 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          # The rc promotion flow puts two tags on one commit (v1.2.3-rc.N and
          # v1.2.3); goreleaser's git-describe version detection can pick the
          # wrong one. Pin it to the tag that actually triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # SLSA build provenance linking the release artifacts back to this
      # workflow run and source commit. Verify with `gh attestation verify`.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz

      # Keyless-sign the immutable version-pinned image tags. cosign resolves
      # each tag to its digest and signs by digest; floating tags (e.g.
      # *-latest) share that digest, so a digest-based verify still holds.
      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          for ref in \
            "ethpandaops/panda:${VERSION}" \
            "ethpandaops/panda:server-${VERSION}" \
            "ethpandaops/panda:proxy-${VERSION}" \
            "ethpandaops/panda:sandbox-${VERSION}"; do
            echo "Signing ${ref}"
            cosign sign --recursive "${ref}"
          done
