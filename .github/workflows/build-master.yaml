name: Build Master Images

on:
  push:
    branches: [master]

permissions:
  contents: read

# Every run moves the *-master-latest tags, so runs queue rather than overlap:
# an older run can't fail at the mirror after a newer one moved them.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      version: master-${{ needs.meta.outputs.short-sha }}
      server-tags: server-master-${{ needs.meta.outputs.short-sha }},server-master-latest
      cli-tags: master-${{ needs.meta.outputs.short-sha }},master-latest
      proxy-tags: proxy-master-${{ needs.meta.outputs.short-sha }},proxy-master-latest
      sandbox-tags: sandbox-master-${{ needs.meta.outputs.short-sha }},sandbox-master-latest
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}
