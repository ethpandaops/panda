name: Build and Push Images

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for ldflags (e.g., pr-42, master-abc1234)"
        required: true
        type: string
      server-tags:
        description: "Comma-separated Docker tags for server image"
        required: true
        type: string
      cli-tags:
        description: "Comma-separated Docker tags for CLI image"
        required: true
        type: string
      proxy-tags:
        description: "Comma-separated Docker tags for proxy image"
        required: true
        type: string
      sandbox-tags:
        description: "Comma-separated Docker tags for sandbox image"
        required: true
        type: string
    secrets:
      IMAGE_MIRROR_URL:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io/ethpandaops
      id-token: write      # attest, and authenticate to the image mirror
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build binaries
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          LDFLAGS="-s -w \
            -X github.com/ethpandaops/panda/internal/version.Version=${VERSION} \
            -X github.com/ethpandaops/panda/internal/version.GitCommit=${SHA} \
            -X github.com/ethpandaops/panda/internal/version.BuildTime=${BUILD_TIME}"

          for GOARCH in amd64 arm64; do
            PLATFORM="linux/${GOARCH}"
            mkdir -p "${PLATFORM}"
            echo "Building for ${PLATFORM}..."
            CGO_ENABLED=0 GOOS=linux GOARCH=${GOARCH} go build -ldflags "${LDFLAGS}" -o "${PLATFORM}/panda-server" ./cmd/server
            CGO_ENABLED=0 GOOS=linux GOARCH=${GOARCH} go build -ldflags "${LDFLAGS}" -o "${PLATFORM}/panda" ./cmd/panda
            CGO_ENABLED=0 GOOS=linux GOARCH=${GOARCH} go build -ldflags "${LDFLAGS}" -o "${PLATFORM}/panda-proxy" ./cmd/proxy
          done

      - name: Build and push server image
        id: server
        run: |
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.server-tags }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="${TAGS} --tag ghcr.io/ethpandaops/panda:${TAG}"
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file goreleaser.server.Dockerfile \
            ${TAGS} \
            --metadata-file "$RUNNER_TEMP/server-metadata.json" \
            --push .

          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/server-metadata.json")
          echo "tags=$(printf "%s@${DIGEST} " "${TAG_ARRAY[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push CLI image
        id: cli
        run: |
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.cli-tags }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="${TAGS} --tag ghcr.io/ethpandaops/panda:${TAG}"
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file goreleaser.panda.Dockerfile \
            ${TAGS} \
            --metadata-file "$RUNNER_TEMP/cli-metadata.json" \
            --push .

          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/cli-metadata.json")
          echo "tags=$(printf "%s@${DIGEST} " "${TAG_ARRAY[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push proxy image
        id: proxy
        run: |
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.proxy-tags }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="${TAGS} --tag ghcr.io/ethpandaops/panda:${TAG}"
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file goreleaser.proxy.Dockerfile \
            ${TAGS} \
            --metadata-file "$RUNNER_TEMP/proxy-metadata.json" \
            --push .

          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/proxy-metadata.json")
          echo "tags=$(printf "%s@${DIGEST} " "${TAG_ARRAY[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push sandbox image
        id: sandbox
        run: |
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.sandbox-tags }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="${TAGS} --tag ghcr.io/ethpandaops/panda:${TAG}"
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file sandbox/Dockerfile \
            ${TAGS} \
            --metadata-file "$RUNNER_TEMP/sandbox-metadata.json" \
            --push .

          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/sandbox-metadata.json")
          echo "tags=$(printf "%s@${DIGEST} " "${TAG_ARRAY[@]}")" >> "$GITHUB_OUTPUT"

      # All four images were built in this job, so it attests every platform
      # manifest behind them too (the default).
      - name: Attest and mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: panda
          tags: ${{ steps.server.outputs.tags }} ${{ steps.cli.outputs.tags }} ${{ steps.proxy.outputs.tags }} ${{ steps.sandbox.outputs.tags }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
