ethnode_sync_status:
  name: Node Sync Status
  description: Check sync status of beacon and execution nodes
  examples:
    - name: Check beacon node sync status
      description: Get sync status from a specific beacon node
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        syncing = ethnode.get_node_syncing(network, instance)
        print(f"Node {instance} sync status:")
        print(f"  Head slot: {syncing['data']['head_slot']}")
        print(f"  Sync distance: {syncing['data']['sync_distance']}")
        print(f"  Is syncing: {syncing['data']['is_syncing']}")

    - name: Check execution node sync status
      description: Get sync status from a specific execution node
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        syncing = ethnode.eth_syncing(network, instance)
        block_number = ethnode.eth_block_number(network, instance)
        print(f"EL sync status: {syncing}")
        print(f"Current block: {block_number}")

    - name: Compare sync across multiple nodes
      description: Compare sync status across multiple nodes to detect splits
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instances = ["<instance-a>", "<instance-b>", "<instance-c>"]  # replace with instances in that network

        for instance in instances:
            try:
                syncing = ethnode.get_node_syncing(network, instance)
                head_slot = syncing['data']['head_slot']
                print(f"{instance}: head_slot={head_slot}")
            except Exception as e:
                print(f"{instance}: ERROR - {e}")

ethnode_node_info:
  name: Node Information
  description: Get node identity, version, and peer information
  examples:
    - name: Get node version
      description: Get the software version of a beacon node
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        # Beacon node version
        version = ethnode.get_node_version(network, instance)
        print(f"CL version: {version['data']['version']}")

        # Execution node version
        el_version = ethnode.web3_client_version(network, instance)
        print(f"EL version: {el_version}")

    - name: Check peer connectivity
      description: Check peer count and connectivity of a node
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        # CL peers
        peer_count = ethnode.get_peer_count(network, instance)
        print(f"CL peers: {peer_count['data']}")

        # EL peers
        el_peers = ethnode.net_peer_count(network, instance)
        print(f"EL peers: {el_peers}")

ethnode_chain_status:
  name: Chain Status
  description: Check finality, chain config, and block information
  examples:
    - name: Check finality checkpoints
      description: Get finality checkpoint information from a beacon node
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        checkpoints = ethnode.get_finality_checkpoints(network, instance)
        data = checkpoints['data']
        print(f"Finalized: epoch {data['finalized']['epoch']}")
        print(f"Justified: epoch {data['current_justified']['epoch']}")
        print(f"Previous justified: epoch {data['previous_justified']['epoch']}")

    - name: Get chain configuration
      description: Get the chain spec and fork schedule
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        spec = ethnode.get_config_spec(network, instance)
        print(f"Config name: {spec['data'].get('CONFIG_NAME', 'unknown')}")
        print(f"Preset: {spec['data'].get('PRESET_BASE', 'unknown')}")

        forks = ethnode.get_fork_schedule(network, instance)
        for fork in forks['data']:
            print(f"  Fork {fork['current_version']}: epoch {fork['epoch']}")

    - name: Get latest beacon header and EL block
      description: Get the latest beacon block header and execution block number
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        # Latest beacon header
        header = ethnode.get_beacon_headers(network, instance)
        slot = header['data']['header']['message']['slot']
        print(f"Latest CL slot: {slot}")

        # Latest EL block
        block_num = ethnode.eth_block_number(network, instance)
        print(f"Latest EL block: {block_num}")

    - name: Compare head roots and finality across nodes
      description: Compare direct beacon-node head roots, sync status, and finalized checkpoints across several instances to validate splits or finality lag.
      query: |
        from ethpandaops import ethnode

        network = "<network>"
        instances = ["<instance-a>", "<instance-b>", "<instance-c>"]

        rows = []
        for instance in instances:
            try:
                syncing = ethnode.get_node_syncing(network, instance)
                checkpoints = ethnode.get_finality_checkpoints(network, instance)
                header = ethnode.get_beacon_headers(network, instance)
                rows.append({
                    "instance": instance,
                    "head_slot": syncing["data"].get("head_slot"),
                    "sync_distance": syncing["data"].get("sync_distance"),
                    "is_syncing": syncing["data"].get("is_syncing"),
                    "finalized_epoch": checkpoints["data"]["finalized"]["epoch"],
                    "head_root": header["data"]["root"],
                })
            except Exception as e:
                rows.append({"instance": instance, "error": str(e)})

        for row in rows:
            print(row)

    - name: Detect ePBS and payload-attestation fields
      description: Inspect a beacon block body for Gloas/ePBS fields such as signed_execution_payload_bid and payload_attestations.
      query: |
        from ethpandaops import ethnode

        network = "<network>"
        instance = "<instance-name>"

        head = ethnode.beacon_get(network, instance, "/eth/v2/beacon/blocks/head")
        body = head["data"]["message"]["body"]

        model = {
            "is_epbs": "signed_execution_payload_bid" in body,
            "has_payload_attestations": "payload_attestations" in body,
            "has_data_column_fields": "blob_data_available" in str(body),
        }
        print(model)

ethnode_epbs_payloads:
  name: ePBS Payloads
  description: Inspect Gloas/ePBS bids, PTC payload verdicts, and builder reveal rates using direct beacon API calls.
  examples:
    - name: Get PTC payload facts for a slot
      description: For an ePBS slot, read the signed execution payload bid from the slot block and the PTC payload_present verdict from the next block.
      query: |
        from ethpandaops import ethnode

        SELF_BUILD = 18446744073709551615

        network = "<network>"
        instance = "<instance-name>"
        slot = 123456

        block = ethnode.beacon_get(network, instance, f"/eth/v2/beacon/blocks/{slot}")
        message = block["data"]["message"]
        body = message["body"]
        bid = body["signed_execution_payload_bid"]["message"]

        facts = {
            "slot": slot,
            "proposer_index": int(message["proposer_index"]),
            "builder_index": int(bid["builder_index"]),
            "bid_value": int(bid["value"]),
            "block_hash": bid.get("block_hash"),
            "is_self_build": int(bid["builder_index"]) == SELF_BUILD,
            "payload_present": None,
            "blob_data_available": None,
        }

        next_block = ethnode.beacon_get(network, instance, f"/eth/v2/beacon/blocks/{slot + 1}")
        next_body = next_block["data"]["message"]["body"]
        for pa in next_body.get("payload_attestations", []):
            data = pa["data"]
            if int(data["slot"]) == slot:
                facts["payload_present"] = bool(data.get("payload_present"))
                if "blob_data_available" in data:
                    facts["blob_data_available"] = bool(data.get("blob_data_available"))
                break

        print(facts)

    - name: Summarize payload presence by builder
      description: Group ePBS PTC payload_present verdicts by builder_index over a recent slot window to find builders with poor reveal rates.
      query: |
        from collections import defaultdict
        from ethpandaops import ethnode

        SELF_BUILD = 18446744073709551615

        network = "<network>"
        instance = "<instance-name>"
        head_slot = int(ethnode.get_beacon_headers(network, instance)["data"]["header"]["message"]["slot"])
        lo = head_slot - 100

        def slot_payload_facts(slot):
            block = ethnode.beacon_get(network, instance, f"/eth/v2/beacon/blocks/{slot}")
            message = block["data"]["message"]
            bid = message["body"]["signed_execution_payload_bid"]["message"]
            facts = {
                "slot": slot,
                "builder_index": int(bid["builder_index"]),
                "payload_present": None,
            }
            try:
                next_block = ethnode.beacon_get(network, instance, f"/eth/v2/beacon/blocks/{slot + 1}")
                next_body = next_block["data"]["message"]["body"]
                for pa in next_body.get("payload_attestations", []):
                    data = pa["data"]
                    if int(data["slot"]) == slot:
                        facts["payload_present"] = bool(data.get("payload_present"))
                        break
            except Exception as e:
                facts["ptc_error"] = str(e)
            return facts

        agg = defaultdict(lambda: {"present": 0, "absent": 0, "unknown": 0, "absent_slots": []})

        for slot in range(lo, head_slot):
            fact = slot_payload_facts(slot)
            builder = fact["builder_index"]
            if fact["payload_present"] is True:
                agg[builder]["present"] += 1
            elif fact["payload_present"] is False:
                agg[builder]["absent"] += 1
                agg[builder]["absent_slots"].append(slot)
            else:
                agg[builder]["unknown"] += 1

        for builder, counts in sorted(agg.items()):
            known = counts["present"] + counts["absent"]
            reveal_rate = None if known == 0 else counts["present"] / known
            tag = "SELF_BUILD" if builder == SELF_BUILD else f"builder {builder}"
            print({
                "builder_index": builder,
                "tag": tag,
                "present": counts["present"],
                "absent": counts["absent"],
                "unknown": counts["unknown"],
                "reveal_rate": reveal_rate,
                "absent_slots": counts["absent_slots"],
            })

ethnode_advanced:
  name: Advanced Queries
  description: Use generic pass-through for advanced API calls
  examples:
    - name: Generic beacon API call
      description: Use the generic beacon_get function for any beacon API endpoint
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        # Get deposit contract info
        deposit = ethnode.beacon_get(network, instance, "/eth/v1/config/deposit_contract")
        print(f"Deposit contract: {deposit}")

        # Get node identity
        identity = ethnode.beacon_get(network, instance, "/eth/v1/node/identity")
        print(f"Peer ID: {identity['data']['peer_id']}")

    - name: Generic execution RPC call
      description: Use the generic execution_rpc function for any JSON-RPC method
      query: |
        from ethpandaops import ethnode

        networks = ethnode.list_networks()
        if not networks:
            raise RuntimeError("no ethnode-reachable active networks")

        network = networks[0]["name"]
        instance = "<instance-name>"  # replace with an instance in that network

        # Get a specific block
        block = ethnode.execution_rpc(network, instance, "eth_getBlockByNumber", ["latest", False])
        print(f"Block number: {block['number']}")
        print(f"Block hash: {block['hash']}")
        print(f"Transactions: {len(block.get('transactions', []))}")
