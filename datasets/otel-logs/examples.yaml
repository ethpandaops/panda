# Query examples for the otel-logs dataset.

devnet_logs:
  name: Local Devnet OTel Logs
  description: Queries for local Kurtosis devnet OTel logs. These live in the otel-logs dataset on a
    locally autodiscovered ClickHouse datasource — pick the datasource that holds otel-logs for your
    local devnet (see datasets://otel-logs and datasources://). Replace {db} with the database hosting
    the otel-logs dataset, given by the datasource's dataset params or its default database.
  examples:
  - name: List local devnet enclaves
    description: List Kurtosis enclave names currently present in the shared local OTel logs table. Run
      this before filtering logs because multiple devnets can share one table.
    query: |
      SELECT DISTINCT EnclaveName
      FROM {db}.otel_logs
      WHERE EnclaveName != ''
      ORDER BY EnclaveName
  - name: Recent service errors
    description: Fetch recent error-class logs for a specific service in a specific local Kurtosis enclave
      by matching the raw log body.
    query: |
      SELECT
        Timestamp,
        ServiceName,
        Body
      FROM {db}.otel_logs
      WHERE EnclaveName = {enclave:String}
        AND ServiceName = {service:String}
        AND match(Body, '(?i)(crit|err|error|fatal)')
        AND Timestamp >= now() - INTERVAL 1 HOUR
      ORDER BY Timestamp DESC
      LIMIT 200
  - name: EL warnings and errors
    description: Fetch recent EL warning/error logs for a local Kurtosis enclave by matching the raw log
      body.
    query: |
      SELECT
        Timestamp,
        ServiceName,
        Body
      FROM {db}.otel_logs
      WHERE EnclaveName = {enclave:String}
        AND ServiceName LIKE 'el-%'
        AND match(Body, '(?i)(crit|err|error|fatal|warn)')
        AND Timestamp >= now() - INTERVAL 1 HOUR
      ORDER BY Timestamp DESC
      LIMIT 200
production_devnet_logs:
  name: Production Devnet OTel Logs
  description: Queries for hosted (multi-VM) devnet and testnet container logs. These live in the otel-logs
    dataset on the hosted ClickHouse datasource — pick the datasource that holds otel-logs for hosted
    networks (see datasets://otel-logs and datasources://), table {db}.otel_logs. Replace {db} with the
    database from the datasource's otel-logs dataset params. Logs are keyed by ResourceAttributes['network']
    (devnet name) and ResourceAttributes['host.name'] (node, e.g. lighthouse-geth-super-1). SeverityText
    is usually empty for raw Docker logs, so match severity on Body. This is NOT for local Kurtosis devnets,
    which use a separate locally autodiscovered datasource.
  examples:
  - name: List devnet nodes shipping logs
    description: List the nodes (host.name) currently shipping container logs for a hosted devnet. Run
      this to discover the node topology before drilling into a specific node.
    query: |
      SELECT DISTINCT ResourceAttributes['host.name'] AS host
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND Timestamp >= now() - INTERVAL 1 HOUR
      ORDER BY host
  - name: List containers on a hosted node
    description: List per-container log files and sample lines for one hosted network node. Use this
      to identify which container is the CL, EL, validator, builder, relay, or sidecar before filtering
      by LogAttributes['log.file.name'].
    query: |
      SELECT
        LogAttributes['log.file.name'] AS container_log,
        count() AS lines,
        any(substring(Body, 1, 180)) AS sample
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND ResourceAttributes['host.name'] = {host:String}
        AND Timestamp >= now() - INTERVAL 1 HOUR
      GROUP BY container_log
      ORDER BY lines DESC
  - name: Recent node errors
    description: Fetch recent error-class logs for one devnet node by matching the raw log body. A node
      VM mixes its CL, EL, validator and sidecar containers — use LogAttributes['log.file.name'] to tell
      them apart.
    query: |
      SELECT
        Timestamp,
        ResourceAttributes['host.name'] AS host,
        LogAttributes['log.file.name'] AS container_log,
        Body
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND ResourceAttributes['host.name'] = {host:String}
        AND match(Body, '(?i)(crit|err|error|fatal)')
        AND Timestamp >= now() - INTERVAL 1 HOUR
      ORDER BY Timestamp DESC
      LIMIT 200
  - name: Errors across a consensus client type
    description: Sweep error-class logs across all nodes running a given CL client. host.name is <cl>-<el>-<tier>-<n>,
      so a 'lighthouse-%' prefix matches lighthouse-CL nodes. Results still mix each node's EL/sidecar
      lines.
    query: |
      SELECT
        Timestamp,
        ResourceAttributes['host.name'] AS host,
        Body
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND ResourceAttributes['host.name'] LIKE {cl_prefix:String}
        AND match(Body, '(?i)(crit|err|error|fatal)')
        AND Timestamp >= now() - INTERVAL 1 HOUR
      ORDER BY Timestamp DESC
      LIMIT 500
  - name: Map ePBS builder index to host
    description: Find buildoor or builder-sidecar log lines that announce Bid submitted with builder_index,
      then use the emitting host as the builder node for reveal investigation.
    query: |
      SELECT
        Timestamp,
        ResourceAttributes['host.name'] AS host,
        LogAttributes['log.file.name'] AS container_log,
        Body
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND Timestamp >= now() - INTERVAL 1 HOUR
        AND Body LIKE '%Bid submitted%builder_index=%'
      ORDER BY Timestamp DESC
      LIMIT 100
  - name: Builder reveal logs for a slot window
    description: Fetch builder-side reveal, envelope, payload, and propagation logs for a buildoor host
      around an affected ePBS slot. Pass a tight timestamp window around the slot start.
    query: |
      SELECT
        Timestamp,
        ResourceAttributes['host.name'] AS host,
        LogAttributes['log.file.name'] AS container_log,
        Body
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND ResourceAttributes['host.name'] = {host:String}
        AND Timestamp BETWEEN {start:String} AND {end:String}
        AND match(Body, '(?i)(bid submitted|included on-chain|reveal|envelope|payload|0 peers|giving up|error|failed|400|bad_request)')
      ORDER BY Timestamp
      LIMIT 200
  - name: Logs for one container in a time window
    description: Fetch all log lines for a specific container log file on a hosted node in a tight
      timeframe, useful after a container has been identified from sample lines.
    query: |
      SELECT
        Timestamp,
        ResourceAttributes['host.name'] AS host,
        LogAttributes['log.file.name'] AS container_log,
        Body
      FROM {db}.otel_logs
      WHERE ResourceAttributes['network'] = {network:String}
        AND ResourceAttributes['host.name'] = {host:String}
        AND LogAttributes['log.file.name'] = {container:String}
        AND Timestamp BETWEEN {start:String} AND {end:String}
      ORDER BY Timestamp
      LIMIT 500
